<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
</head>
<body>
    <h1>Calculadora de Indice de Massa Corpórea</h1>
    <p>Por favor, digite seu peso e sua altura</p>
    <input type="number" id="peso" placeholder="Ex: 60"> Peso <br>
    <br>
    <input type="number" id="altura" placeholder="Ex: 1,60"> Altura
    <br><br>
    <button type="button" onclick="calcularIMC()">Calcular</button>
    <br>
    <p id="resultado"></p>

    <script>
        function calcularIMC() {
            var peso, altura, imc, classificacao;
            var resultadoDiv = document.getElementById("resultado");
            peso = document.getElementById("peso").value;
            altura = document.getElementById("altura").value;

            if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0 || peso === "" || altura === "") {
            resultadoDiv.innerHTML = "Entrada inválida. Preencha peso e altura corretamente.";
            return;
            }

            peso = parseFloat(peso);
            altura = parseFloat(altura);
            imc = peso / (altura * altura);

            if (imc < 18.5) {
                classificacao = "Baixo do peso";
            }
            else if (imc < 25) {
                classificacao = "Peso normal";
            }
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            }
            else if (imc < 35) {
                classificacao = "Obesidade grau I";
            }
            else if (imc < 40) {
                classificacao = "Obesidade grau II";
            }
            else {
                classificacao = "Obesidade grau III (mórbida)";
            }

            resultadoDiv.innerHTML = "Seu IMC é " + imc.toFixed(2) + " kg/m² - " + classificacao;
        }
    </script>
</body>
</html>
